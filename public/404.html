<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TI.MO SOLUTIONS</title>
    <script>
      // Técnica de redirección SPA para GitHub Pages (rafgraph/spa-github-pages).
      // pathSegmentsToKeep = 1 porque este repo publica bajo un subpath (/timosolutionssas/),
      // no en la raíz del dominio.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
